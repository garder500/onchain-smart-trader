[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/chain",
    "crates/indexer",
    "crates/wallet-profiler",
    "crates/token-risk",
    "crates/strategy",
    "crates/paper-trader",
    "crates/analytics",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Jeremy <garder500>"]
license = "MIT"

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
chain = { path = "crates/chain" }
indexer = { path = "crates/indexer" }
wallet-profiler = { path = "crates/wallet-profiler" }
token-risk = { path = "crates/token-risk" }
strategy = { path = "crates/strategy" }
paper-trader = { path = "crates/paper-trader" }
analytics = { path = "crates/analytics" }

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web & HTTP
axum = { version = "0.8", features = ["json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "uuid", "migrate"] }

# Serialization & Math
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rust_decimal = { version = "1.36", features = ["serde-with-str", "db-postgres", "maths"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Web3 / EVM
alloy = { version = "2.4", default-features = false, features = ["reqwest", "provider-http", "rpc-types-eth", "contract", "sol-types", "json-abi"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Tracing & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
